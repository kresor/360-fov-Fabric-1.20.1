plugins {
    id "fabric-loom" version "1.7.4"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}


// The GitHub fork still contains the upstream 26.x Java sources. GitHub's web
// uploader replaces files but does not delete old ones, so compile only the
// four files that belong to this 1.20.1 rewrite. This makes the port build
// deterministic even while the legacy files remain in the repository.
sourceSets {
    main {
        java {
            include "xpncvr/fov360/Main.java"
            include "xpncvr/fov360/Fov360Config.java"
            include "xpncvr/fov360/Fov360Renderer.java"
            include "xpncvr/fov360/mixin/GameRendererMixin.java"
            include "xpncvr/fov360/mixin/GameOptionsMixin.java"
            include "xpncvr/fov360/mixin/MinecraftClientMixin.java"
            include "xpncvr/fov360/mixin/WindowMixin.java"
        }
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
    it.options.compilerArgs += ["-Xmaxerrs", "1000", "-Xmaxwarns", "1000"]
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
